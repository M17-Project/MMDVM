name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Debian bookworm's ARM toolchain, the one the release images are built with
    runs-on: ubuntu-24.04
    container: debian:bookworm
    defaults:
      run:
        # The container's sh is dash, which has no pipefail
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make git ca-certificates gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build every board
        run: |
          # The Makefile runs git for the GitID, and the container's user doesn't own the checkout
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -o pipefail
          ./build-all.sh 2>&1 | tee build.log

      - name: Report warnings
        if: always()
        run: |
          count=$(grep -c "warning:" build.log || true)
          grep "warning:" build.log | sed 's/^/::warning::/' || true
          echo "Compiler warnings: $count" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/
